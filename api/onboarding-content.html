<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inicio Digital — Client Onboarding</title>
<style>
  :root {
    --green: #1D9E75;
    --green-light: #E1F5EE;
    --green-mid: #9FE1CB;
    --green-dark: #0F6E56;
    --bg: #F7F6F3;
    --surface: #FFFFFF;
    --surface2: #F1F0EC;
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.13);
    --text: #1A1A18;
    --text-2: #5A5A56;
    --text-3: #9A9A94;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
    --shadow-lg: 0 2px 8px rgba(0,0,0,0.08), 0 8px 24px rgba(0,0,0,0.06);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2.5rem 1rem 4rem; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 800px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
  .brand-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .brand-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; color: var(--green); text-transform: uppercase; }
  h1 { font-size: 26px; font-weight: 600; color: var(--text); letter-spacing: -0.3px; margin-bottom: 1.5rem; }
  .mode-toggle { display: flex; gap: 0; background: var(--surface2); border-radius: var(--radius); padding: 4px; margin-bottom: 1.5rem; width: fit-content; border: 1px solid var(--border); }
  .mode-btn { padding: 9px 20px; border-radius: calc(var(--radius) - 4px); border: none; cursor: pointer; font-family: inherit; font-size: 13.5px; font-weight: 500; transition: all 0.18s ease; background: transparent; color: var(--text-2); line-height: 1.3; text-align: center; }
  .mode-btn .sub { font-size: 11px; font-weight: 400; opacity: 0.7; display: block; margin-top: 1px; }
  .mode-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  .fields { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .fields input { flex: 1 1 180px; padding: 10px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; background: var(--surface); color: var(--text); outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
  .fields input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(29,158,117,0.12); }
  .fields input[type=date] { flex: 0 0 160px; }
  .legend { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .legend-label { font-size: 11.5px; color: var(--text-3); }
  .progress-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 1.25rem; box-shadow: var(--shadow); }
  .progress-meta { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .progress-label { font-size: 13px; color: var(--text-2); font-weight: 500; }
  .progress-count { font-size: 22px; font-weight: 600; color: var(--text); letter-spacing: -0.5px; }
  .progress-count span { font-size: 14px; font-weight: 400; color: var(--text-3); }
  .progress-track { background: var(--surface2); border-radius: 99px; height: 7px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green); border-radius: 99px; transition: width 0.4s cubic-bezier(0.4,0,0.2,1); }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.75rem; }
  .tb-btn { font-size: 12.5px; padding: 6px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; font-family: inherit; color: var(--text-2); transition: all 0.15s; font-weight: 500; }
  .tb-btn:hover { background: var(--surface2); color: var(--text); }
  .tb-btn.danger:hover { background: #FEF2F2; color: #B91C1C; border-color: #FECACA; }
  .sections { display: flex; flex-direction: column; gap: 10px; }
  .section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); transition: box-shadow 0.2s; }
  .section:hover { box-shadow: var(--shadow-lg); }
  .sec-header { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: none; border: none; cursor: pointer; font-family: inherit; text-align: left; gap: 12px; border-bottom: 1px solid transparent; transition: background 0.15s; }
  .sec-header:hover { background: var(--surface2); }
  .sec-header.open { border-bottom-color: var(--border); }
  .sec-header-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .chevron { font-size: 10px; color: var(--text-3); transition: transform 0.22s ease; flex-shrink: 0; }
  .chevron.closed { transform: rotate(-90deg); }
  .sec-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .badge-tag { display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 99px; margin-left: 8px; letter-spacing: 0.02em; }
  .tag-critical { background: #FEE2E2; color: #991B1B; }
  .tag-skip { background: #F1F0EC; color: #6B6B65; }
  .sec-badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; flex-shrink: 0; background: var(--surface2); color: var(--text-2); transition: all 0.2s; min-width: 44px; text-align: center; border: 1px solid var(--border); }
  .sec-badge.done { background: var(--green-light); color: var(--green-dark); border-color: var(--green-mid); }
  .sec-note { padding: 10px 16px; font-size: 12.5px; color: var(--text-2); line-height: 1.65; background: #FAFAF8; border-bottom: 1px solid var(--border); border-left: 3px solid var(--green-mid); }
  .sec-note code { font-family: "SF Mono","Fira Code","Courier New",monospace; font-size: 11px; background: #EEEEED; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border-strong); color: var(--text); word-break: break-all; }
  .items { list-style: none; padding: 4px 0 6px; }
  .item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 16px; cursor: grab; transition: background 0.12s; position: relative; }
  .item:hover { background: #FAFAF8; }
  .item.checked { background: #F0FBF6; }
  .item.drag-over { background: #E1F5EE; outline: 2px dashed var(--green-mid); outline-offset: -2px; }
  .drag-handle { color: #C8C8C2; font-size: 15px; margin-top: 2px; flex-shrink: 0; user-select: none; line-height: 1; }
  .item:hover .drag-handle { color: #A0A09A; }
  .custom-cb { position: relative; flex-shrink: 0; margin-top: 3px; }
  .custom-cb input { position: absolute; opacity: 0; width: 18px; height: 18px; cursor: pointer; margin: 0; }
  .cb-box { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid #D0D0CA; background: var(--surface); display: flex; align-items: center; justify-content: center; transition: all 0.15s; pointer-events: none; }
  .custom-cb input:checked ~ .cb-box { background: var(--green); border-color: var(--green); }
  .cb-check { display: none; width: 10px; height: 10px; }
  .custom-cb input:checked ~ .cb-box .cb-check { display: block; }
  .custom-cb:hover .cb-box { border-color: var(--green); }
  .who-badge { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; flex-shrink: 0; margin-top: 2px; letter-spacing: 0.02em; white-space: nowrap; }
  .who-agent { background: #EFF6FF; color: #1D4ED8; }
  .who-human { background: #FFF7ED; color: #C2410C; }
  .who-review { background: #FEFCE8; color: #A16207; }
  .who-skip { background: #F1F0EC; color: #6B6B65; }
  .item-text { font-size: 13px; line-height: 1.6; color: var(--text); cursor: pointer; word-break: break-word; transition: color 0.15s; }
  .item-text.checked { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--text-3); }
  .item-text code { font-family: "SF Mono","Fira Code","Courier New",monospace; font-size: 11.5px; background: #EEEEED; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border-strong); color: var(--text); word-break: break-all; }
  .footer { font-size: 12px; color: var(--text-3); text-align: center; margin-top: 2.5rem; }
  .section.all-done .sec-header { background: var(--green-light); }
  .section.all-done .sec-title { color: var(--green-dark); }
  .item-actions { display: flex; gap: 4px; margin-left: auto; flex-shrink: 0; opacity: 0; transition: opacity 0.15s; }
  .item:hover .item-actions { opacity: 1; }
  .btn-icon { width: 24px; height: 24px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; background: transparent; color: var(--text-3); transition: all 0.12s; padding: 0; flex-shrink: 0; }
  .btn-icon:hover { background: var(--surface2); color: var(--text); }
  .btn-icon.btn-del:hover { background: #FEF2F2; color: #B91C1C; }
  .btn-add-step { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border: none; background: none; cursor: pointer; font-family: inherit; font-size: 12.5px; color: var(--text-3); transition: color 0.15s; width: 100%; }
  .btn-add-step:hover { color: var(--green); }
  .edit-input { width: 100%; padding: 6px 8px; border: 1px solid var(--green); border-radius: 4px; font-size: 13px; font-family: inherit; line-height: 1.6; background: var(--surface); color: var(--text); outline: none; box-shadow: 0 0 0 3px rgba(29,158,117,0.12); resize: vertical; min-height: 34px; }
  .who-select { font-size: 10.5px; font-weight: 600; padding: 2px 6px; border-radius: 99px; border: 1px solid var(--border-strong); cursor: pointer; font-family: inherit; background: var(--surface); }
  .sync-bar { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 5px 12px; font-size: 11.5px; font-weight: 500; z-index: 999; transition: transform 0.3s ease, opacity 0.3s ease; transform: translateY(-100%); opacity: 0; }
  .sync-bar.show { transform: translateY(0); opacity: 1; }
  .sync-bar.saving { background: #FEF3C7; color: #92400E; }
  .sync-bar.saved { background: var(--green-light); color: var(--green-dark); }
  .sync-bar.error { background: #FEE2E2; color: #991B1B; }
  .sync-bar.loading { background: #EFF6FF; color: #1D4ED8; }
</style>
</head>
<body>
<div class="sync-bar" id="sync-bar"></div>
<div class="wrap">
  <div class="brand"><div class="brand-dot"></div><span class="brand-label">Inicio Digital</span></div>
  <h1>Client onboarding</h1>
  <div class="mode-toggle">
    <button class="mode-btn active" id="btn-new" onclick="setMode('new')">New client<span class="sub">New sub-account</span></button>
    <button class="mode-btn" id="btn-old" onclick="setMode('old')">Existing client<span class="sub">Existing sub-account</span></button>
  </div>
  <div class="fields">
    <input type="text" id="clientName" placeholder="Client name"/>
    <input type="date" id="clientDate"/>
  </div>
  <div class="legend">
    <span class="who-badge who-agent">Agent</span>
    <span class="who-badge who-human">Ryan</span>
    <span class="who-badge who-review">Review</span>
    <span class="who-badge who-skip">Skip</span>
    <span class="legend-label">— who completes each step</span>
  </div>
  <div class="progress-card">
    <div class="progress-meta"><span class="progress-label">Progress</span><span class="progress-count"><span id="prog-done">0</span> <span>/ <span id="prog-total">0</span> steps</span></span></div>
    <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div class="toolbar">
    <button class="tb-btn" onclick="expandAll()">Expand all</button>
    <button class="tb-btn" onclick="collapseAll()">Collapse all</button>
    <button class="tb-btn danger" onclick="resetAll()">Reset checkboxes</button>
  </div>
  <div class="sections" id="sections"></div>
  <p class="footer">Drag items within a section to reorder &nbsp;·&nbsp; Progress tracked separately per mode</p>
</div>
<script>
const NEW=[{id:"n-pre",label:"Pre-handover \u2014 Ryan completes before VA starts",note:"These steps require Ryan\u2019s personal accounts and are completed before handing over to the VA. The VA picks up from Phase 1 once these are done and the client contact profile is fully filled in GHL.",items:[{w:"human",t:"Create Facebook page for client"},{w:"human",t:"Connect Facebook page to Meta Business Suite"},{w:"human",t:"Schedule 3 posts using client logo (saved to Mac \u2192 Clients/[Client Name] folder)"},{w:"human",t:"Set up address / regulatory bundle in GHL \u2192 Settings \u2192 Phone System \u2014 name: Ryan McCabe, address: 10 Dukes Road, Glasgow, Scotland, G727BA"}]},{id:"n-p1",label:"Phase 1 \u2014 Setup & connections",note:"Estimated 25 minutes. Creates the sub-account and all supporting infrastructure before automation is configured. All client info comes from the contact profile in the Inicio Digital GHL sub-account.",items:[{w:"agent",t:"Agency level \u2192 Opportunities \u2192 Onboarding pipeline \u2192 move client from Pending to System Setup"},{w:"agent",t:"Agency level \u2192 Account Snapshots \u2192 Window Cleaning Client Snapshot (v1) \u2192 click + (Create New Account) \u2192 Add Manually"},{w:"agent",t:"Fill in Add Sub-Account form: First Name, Last Name, Email, Business Name from contact profile; Business Niche: 'cleaning' or 'service business'; Business Phone; Address/City/State/Country/Zip; Time Zone: Europe/London; toggle 'Add sample data' OFF \u2192 click Add Sub-Account (snapshot pre-loads automatically)"},{w:"agent",t:"GoDaddy \u2192 account.godaddy.com \u2192 Clean Quote business \u2192 Domain \u2192 DNS tab \u2192 Add New Record: Type: CNAME, Name: client shortname (lowercase, no spaces, no punctuation e.g. 'has'), Value: sites.ludicrous.cloud, TTL: 1 Hour \u2192 Save. DNS propagation happens in the background \u2014 domain connection in GHL is completed later in Phase 2."},{w:"agent",t:"Google Sheets \u2192 open the dashboard template sheet \u2192 File \u2192 Make a copy \u2192 rename to '[Client Business Name] - Inicio Dashboard'. This duplicates the full tab structure (Dashboard Data, Batches, Status Log, Config, Tokens) with all formatting and formulas already in place."},{w:"agent",t:"Share the new sheet with the service account email \u2014 Editor access, uncheck Notify people. Service account email: firebase-adminsdk-fbsvc@inicio-dashboad.iam.gserviceaccount.com"},{w:"agent",t:"Add the client to the Master Tenants sheet (docs.google.com/spreadsheets/d/1mTM4zyvZ_Jt_43pYb1vnJQLA5mlvS1jkB3Vk0T1nuzM). This is a central registry the dashboard backend uses to look up which Google Sheet belongs to which client subdomain. Add a new row: (A) subdomain \u2014 the short name used in the URL e.g. 'k' for k.inicio.live; (B) sheet_id \u2014 the long ID from the sheet URL between /d/ and /edit e.g. for https://docs.google.com/spreadsheets/d/1JCPRBwJRRB-q6lc5rplYaXIemFzilwKNfyCbD7dxSqA/edit the sheet_id is 1JCPRBwJRRB-q6lc5rplYaXIemFzilwKNfyCbD7dxSqA; (C) business_name \u2014 the client's full business name e.g. 'K Cleaning Services'"}]},{id:"n-p2cv",label:"Phase 2 \u2014 Custom values",note:"Set at sub-account level under Settings \u2192 Custom Values. These drive bot prompts, SMS templates, and pricing calculations. The Webhook Secret is pre-set in the snapshot and does not need to be changed. Facebook fields are left blank \u2014 Ryan completes these in Phase 3. Frequency format must always be written as 'X weeks' e.g. '4 weeks' or '8 weeks' \u2014 not '4 Weekly'.",items:[{w:"agent",t:"Set Subdomain URL \u2014 e.g. https://has.clean-quote.co.uk"},{w:"agent",t:"Set Frequency 1 Label \u2014 e.g. '4 weeks'. Format must always be 'X weeks' not 'X Weekly'"},{w:"agent",t:"Set Frequency 2 Label \u2014 e.g. '8 weeks' (only if client offers dual frequency, otherwise leave blank)"},{w:"agent",t:"Set Frequency 2 Multiplier \u2014 e.g. 1.25 (only if client offers dual frequency, otherwise leave blank)"},{w:"agent",t:"Set Logo URL \u2014 go to Settings \u2192 Media Storage \u2192 find the client's business logo \u2192 copy its URL \u2192 paste into the Logo URL custom value"},{w:"human",t:"Facebook Dataset ID \u2014 leave blank, Ryan completes in Phase 3"},{w:"human",t:"Facebook Access Token \u2014 leave blank, Ryan completes in Phase 3"}]},{id:"n-p2snap",label:"Phase 2 \u2014 Fix snapshot references",critical:true,note:"Snapshot assets carry references to the previous sub-account. These MUST be reselected or workflows will fail silently. GHL sometimes looks correct but is still pointing to old data \u2014 check every item carefully. A raw ID looks like a long string e.g. cf_xxxxxxxx. Property types and other non-Sheets actions generally transfer correctly \u2014 focus attention on the Google Sheets steps and pipeline/field references.",items:[{w:"agent",t:"Automation \u2192 IDW/01 \u2192 Reselect Pipeline + Stage on the Create Opportunity action"},{w:"agent",t:"IDW/01 \u2192 Reselect property type custom field on all condition branches"},{w:"agent",t:"IDW/01 \u2192 Check all tag steps are working (no broken references)"},{w:"agent",t:"IDW/02 \u2192 Reselect Pipeline + Stage on Find Opportunity + Update Opportunity actions"},{w:"agent",t:"IDW/02 \u2192 Check Update Contact Field action \u2014 Lead Won Date \u2192 Current Date"},{w:"agent",t:"IDW/05 \u2192 Set #2 Update action: STATUS_REASON = {{inboundWebhookRequest.reason}}"},{w:"agent",t:"IDW/05\u201309 \u2192 Reselect pipeline on all Find/Update Opportunity steps"},{w:"agent",t:"IDW/05\u201309 \u2192 Reselect custom fields on all condition branches"},{w:"agent",t:"Verify every action shows correct field names \u2014 not raw IDs (raw IDs appear as long strings like cf_xxxxxxxx)"}]}];

NEW.push({id:"n-p2wh",label:"Phase 2 \u2014 Inbound webhook setup (IDW/05\u201309)",note:"Each webhook workflow needs a sample payload sent to it before GHL can map the incoming data fields. Do this for all 5 workflows FIRST before coming back to finish the remaining workflow steps. Use reqbin.com: (1) go to reqbin.com, (2) set method to POST, (3) paste the workflow's inbound webhook URL \u2014 find this by opening the workflow, clicking the Inbound Webhook trigger, and copying the URL shown, (4) set Content-Type header to application/json, (5) paste the test payload into the body, (6) click Send, (7) back in GHL: click Fetch Sample in the trigger \u2014 it picks up the payload you just sent, (8) click Save Trigger. Once all 5 are done, copy all 5 URLs into the Config tab.",items:[{w:"agent",t:'IDW/05 \u2192 open workflow \u2192 Inbound Webhook trigger \u2192 copy URL \u2192 reqbin.com \u2192 POST body: {"id":"TEST001","reason":"test"} \u2192 Send \u2192 GHL: Fetch Sample \u2192 Save Trigger'},{w:"agent",t:'IDW/06 \u2192 same process \u2192 POST body: {"id":"TEST001","reason":"test"} \u2192 Fetch Sample \u2192 Save Trigger'},{w:"agent",t:'IDW/07 \u2192 same process \u2192 POST body: {"id":"TEST001","reason":"test"} \u2192 Fetch Sample \u2192 Save Trigger'},{w:"agent",t:'IDW/08 \u2192 same process \u2192 POST body: {"id":"TEST001"} (no reason field) \u2192 Fetch Sample \u2192 Save Trigger'},{w:"agent",t:'IDW/09 \u2192 same process \u2192 POST body: {"id":"TEST001","notes":"test"} \u2192 Fetch Sample \u2192 Save Trigger'},{w:"agent",t:"Copy all 5 webhook URLs \u2192 paste into Config tab of the client's Google Sheet: webhook_decline (IDW/05), webhook_cancel (IDW/06), webhook_lost (IDW/07), webhook_restore (IDW/08), webhook_notes (IDW/09)"}]},{id:"n-p2sh",label:"Phase 2 \u2014 Google Sheets connections",note:"The Google account must be connected at sub-account level first \u2014 without this, the Sheets action dropdown will not appear inside workflow steps. Connecting opens Settings \u2192 Integrations in a new tab, not a popup. The property type field in IDW/02 must include both property type and flat level so flat heights are captured correctly.",items:[{w:"agent",t:"Settings \u2192 Integrations \u2192 Google \u2192 connect ryan@iniciodigital.co.uk at sub-account level (opens in a new tab)"},{w:"agent",t:"IDW/02 \u2192 Update Spreadsheet Row step \u2192 reconnect to client's Dashboard Data tab \u2192 verify column mapping includes: property_type = {{contact.property_type}} {{contact.flat_level_radio}} (both values space-separated in the same field to capture flat floor height)"},{w:"agent",t:"IDW/05 \u2192 Lookup step (id = {{inboundWebhookRequest.id}}) + Update step (status: declined, reason: {{inboundWebhookRequest.reason}}, date) \u2192 Dashboard Data"},{w:"agent",t:"IDW/06 \u2192 Lookup + Update (status: Cancelled) \u2192 Dashboard Data"},{w:"agent",t:"IDW/07 \u2192 Lookup + Update (status: lost) \u2192 Dashboard Data"},{w:"agent",t:"IDW/08 \u2192 Lookup + Update (status: active, reason: restored) \u2192 Dashboard Data"},{w:"agent",t:"IDW/09 \u2192 Lookup + Update (notes: {{inboundWebhookRequest.notes}}) \u2192 Dashboard Data"}]},{id:"n-p2sur",label:"Phase 2 \u2014 Survey setup",note:"The funnel loads from the snapshot. The clean-quote.co.uk domain must be removed from the old snapshot funnel first, then connected to the new client's funnel. Consent links, property types, and cookie consent are configured after the domain is connected.",items:[{w:"agent",t:"Sites \u2192 Funnels \u2192 Window Survey \u2192 Settings tab \u2192 Domain dropdown \u2192 if a domain is already assigned from the snapshot, remove it first \u2192 Save"},{w:"agent",t:"Settings \u2192 Domains & URL Redirects \u2192 + Create \u2192 enter https://[subdomain].clean-quote.co.uk \u2192 Continue \u2192 GoDaddy detected \u2192 Authorize domain \u2192 Agree/Authorize in GoDaddy popup"},{w:"agent",t:"Sites \u2192 Funnels \u2192 Window Survey \u2192 Settings tab \u2192 Domain dropdown \u2192 select [subdomain].clean-quote.co.uk \u2192 Save"},{w:"agent",t:"Funnels \u2192 Window Survey \u2192 Edit \u2192 Survey Builder \u2192 consent checkbox \u2192 click Terms & Conditions link \u2192 update URL to https://[subdomain].clean-quote.co.uk/tc \u2192 Save. Repeat for Privacy Policy \u2192 /pp \u2192 Save. Click Save (top right of Survey Builder)"},{w:"agent",t:"Still in Survey Builder \u2192 Property Type question \u2192 check client contact profile for 'property exception field': No value = leave defaults. 'No flats' = delete Flat option. 'Flats up to X floor' = delete floors above X from the FLAT - Level question"},{w:"agent",t:"Page builder \u2192 Cookie Consent icon \u2192 toggle ON \u2192 Agree \u2192 Compliance type: Don't ask \u2192 delete last sentence of message \u2192 Styling: font 14, bg #FFFFFF, text #000000, button #000000/#ffffff \u2192 Position: floating right \u2192 Publish"},{w:"agent",t:"Rebrand logo in 4 locations (same file, consistent 120\u2013150px width): Window Survey Desktop nav \u2192 Window Survey Mobile nav \u2192 Window Survey Complete Desktop nav \u2192 Window Survey Complete Mobile nav \u2192 Publish. Logo source: Mac \u2192 Clients/[Client Name] folder. Upload once via Media Storage, select from media for remaining 3."}]},{id:"n-p2pr",label:"Phase 2 \u2014 Survey pricing",note:"Pricing is set via GHL Score/Calculations on individual survey options. The snapshot carries SuperClean's default values \u2014 check these against the client's minimum price and flag to Ryan if they differ. All prices anchor to the client's minimum price.",items:[{w:"agent",t:"Check client contact profile for 'Window Cleaning Minimum Price' custom field \u2014 note the value"},{w:"review",t:"Compare snapshot pricing values against client's minimum price \u2014 update if different from SuperClean defaults"},{w:"review",t:"House pricing: Terraced = min; Bungalow = min; Semi-Detached = min+1; Detached = min+1; Townhouse/3+ Fl let mode="new";
const state={new:{checked:{},order:{}},old:{checked:{},order:{}},collapsed:{}};
function initState(sections,key){sections.forEach(s=>{state[key].order[s.id]=s.items.map((_,i)=>i);s.items.forEach((_,i)=>{state[key].checked[`${s.id}-${i}`]=false;});});}
initState(NEW,"new");initState(OLD,"old");
document.getElementById("clientDate").value=new Date().toISOString().slice(0,10);
function getSections(){return mode==="new"?NEW:OLD;}
function getState(){return state[mode];}
function updateProgress(){const s=getState();const keys=Object.keys(s.checked);const done=keys.filter(k=>s.checked[k]).length;const total=keys.length;const pct=total?Math.round(done/total*100):0;document.getElementById("prog-done").textContent=done;document.getElementById("prog-total").textContent=total;document.getElementById("prog-fill").style.width=pct+"%";}
function updateBadge(sId){const sec=getSections().find(x=>x.id===sId);const s=getState();const done=state[mode].order[sId].filter(i=>s.checked[`${sId}-${i}`]).length;const total=sec.items.length;const badge=document.querySelector(`[data-badge="${sId}"]`);const secEl=document.getElementById(`sec-${sId}`);if(badge){badge.textContent=`${done}/${total}`;badge.className="sec-badge"+(done===total?" done":"");}if(secEl){secEl.classList.toggle("all-done",done===total);}}
function whoClass(w){return{agent:"who-agent",human:"who-human",review:"who-review",skip:"who-skip"}[w]||"who-agent";}
function whoLabel(w){return{agent:"Agent",human:"Ryan",review:"Review",skip:"Skip"}[w]||"Agent";}
let dragFrom=null,dragFromSid=null;
function deleteItem(sec,itemIdx){
  const s=getState();
  const order=s.order[sec.id];
  const pos=order.indexOf(itemIdx);
  if(pos===-1)return;
  order.splice(pos,1);
  delete s.checked[`${sec.id}-${itemIdx}`];
  renderItems(sec);updateBadge(sec.id);updateProgress();
}
function startEdit(sec,itemIdx,li){
  const item=sec.items[itemIdx];
  const txt=li.querySelector(".item-text");
  const badge=li.querySelector(".who-badge");
  if(li.querySelector(".edit-input"))return;
  const input=document.createElement("textarea");
  input.className="edit-input";
  input.value=item.t;
  input.rows=Math.max(2,Math.ceil(item.t.length/80));
  txt.style.display="none";
  txt.parentNode.insertBefore(input,txt.nextSibling);
  input.focus();
  const save=()=>{
    const v=input.value.trim();
    if(v){item.t=v;}
    txt.style.display="";
    input.remove();
    renderItems(sec);
    if(typeof schedSave==="function")schedSave();
  };
  input.addEventListener("blur",save);
  input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();save();}if(e.key==="Escape"){input.value=item.t;save();}});
}
function addItem(sec){
  const s=getState();
  const newIdx=sec.items.length;
  sec.items.push({w:"agent",t:"New step"});
  s.order[sec.id].push(newIdx);
  s.checked[`${sec.id}-${newIdx}`]=false;
  renderItems(sec);updateBadge(sec.id);updateProgress();
  const ul=document.querySelector(`#sec-${sec.id} ul`);
  const lastLi=ul?ul.lastElementChild:null;
  if(lastLi){startEdit(sec,newIdx,lastLi);}
}
function cycleWho(sec,itemIdx){
  const roles=["agent","human","review","skip"];
  const item=sec.items[itemIdx];
  const cur=roles.indexOf(item.w);
  item.w=roles[(cur+1)%roles.length];
  renderItems(sec);
}
function renderItems(sec){const s=getState();const ul=document.querySelector(`#sec-${sec.id} ul`);if(!ul)return;ul.innerHTML="";state[mode].order[sec.id].forEach((itemIdx,posIdx)=>{const item=sec.items[itemIdx];const key=`${sec.id}-${itemIdx}`;const isChecked=s.checked[key];const li=document.createElement("li");li.className="item"+(isChecked?" checked":"");li.draggable=true;li.dataset.pos=posIdx;const safeText=item.t.replace(/</g,"&lt;").replace(/>/g,"&gt;");const codeText=safeText.replace(/`([^`]+)`/g,"<code>$1</code>");li.innerHTML=`<span class="drag-handle">\u2807</span><label class="custom-cb"><input type="checkbox" ${isChecked?"checked":""}/><div class="cb-box"><svg class="cb-check" viewBox="0 0 10 10" fill="none"><polyline points="1.5,5 4,7.5 8.5,2.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></label><span class="who-badge ${whoClass(item.w)}" title="Click to change role">${whoLabel(item.w)}</span><span class="item-text${isChecked?" checked":""}">${codeText}</span><span class="item-actions"><button class="btn-icon" title="Edit step">\u270E</button><button class="btn-icon btn-del" title="Delete step">\u2715</button></span>`;const cb=li.querySelector("input");const txt=li.querySelector(".item-text");const toggle=()=>{s.checked[key]=!s.checked[key];li.classList.toggle("checked",s.checked[key]);cb.checked=s.checked[key];txt.classList.toggle("checked",s.checked[key]);updateProgress();updateBadge(sec.id);if(typeof schedSave==="function")schedSave();};cb.addEventListener("change",toggle);
  const whoBadge=li.querySelector(".who-badge");whoBadge.style.cursor="pointer";whoBadge.addEventListener("click",e=>{e.stopPropagation();cycleWho(sec,itemIdx);});
  const editBtn=li.querySelector(".btn-icon");editBtn.addEventListener("click",e=>{e.stopPropagation();startEdit(sec,itemIdx,li);});
  const delBtn=li.querySelector(".btn-del");delBtn.addEventListener("click",e=>{e.stopPropagation();deleteItem(sec,itemIdx);});
  txt.addEventListener("click",toggle);li.addEventListener("dragstart",()=>{dragFrom=posIdx;dragFromSid=sec.id;li.style.opacity="0.5";});li.addEventListener("dragend",()=>{li.style.opacity="1";document.querySelectorAll(".drag-over").forEach(el=>el.classList.remove("drag-over"));});li.addEventListener("dragover",e=>{e.preventDefault();if(dragFromSid===sec.id)li.classList.add("drag-over");});li.addEventListener("dragleave",()=>li.classList.remove("drag-over"));li.addEventListener("drop",e=>{e.preventDefault();li.classList.remove("drag-over");if(dragFromSid!==sec.id||dragFrom===null||dragFrom===posIdx)return;const arr=state[mode].order[sec.id];const[moved]=arr.splice(dragFrom,1);arr.splice(posIdx,0,moved);renderItems(sec);updateBadge(sec.id);if(typeof schedSave==="function")schedSave();});ul.appendChild(li);});
  const addBtn=document.createElement("button");addBtn.className="btn-add-step";addBtn.innerHTML="+ Add step";addBtn.addEventListener("click",()=>addItem(sec));ul.appendChild(addBtn);}
function render(){const container=document.getElementById("sections");container.innerHTML="";getSections().forEach(sec=>{const s=getState();const done=state[mode].order[sec.id].filter(i=>s.checked[`${sec.id}-${i}`]).length;const total=sec.items.length;const isCollapsed=state.collapsed[sec.id];const allDone=done===total;const div=document.createElement("div");div.className="section"+(allDone?" all-done":"");div.id=`sec-${sec.id}`;const critBadge=sec.critical?`<span class="badge-tag tag-critical">critical</span>`:"";const skipBadge=sec.skip?`<span class="badge-tag tag-skip">skip</span>`:"";const noteHtml=(!isCollapsed&&sec.note)?`<div class="sec-note">${sec.note.replace(/`([^`]+)`/g,"<code>$1</code>")}</div>`:"";div.innerHTML=`<button class="sec-header${isCollapsed?"":" open"}" data-sid="${sec.id}"><div class="sec-header-left"><span class="chevron${isCollapsed?" closed":""}">\u25BC</span><span class="sec-title">${sec.label}${critBadge}${skipBadge}</span></div><span class="sec-badge${allDone?" done":""}" data-badge="${sec.id}">${done}/${total}</span></button>${noteHtml}<ul style="display:${isCollapsed?"none":"block"}"></ul>`;div.querySelector(".sec-header").addEventListener("click",()=>{state.collapsed[sec.id]=!state.collapsed[sec.id];render();updateProgress();});container.appendChild(div);if(!isCollapsed)renderItems(sec);});updateProgress();}
function setMode(m){mode=m;document.getElementById("btn-new").classList.toggle("active",m==="new");document.getElementById("btn-old").classList.toggle("active",m==="old");render();}
function expandAll(){getSections().forEach(s=>{state.collapsed[s.id]=false;});render();}
function collapseAll(){getSections().forEach(s=>{state.collapsed[s.id]=true;});render();}
function resetAll(){if(!confirm("Reset all checkboxes for this onboarding?"))return;const s=getState();Object.keys(s.checked).forEach(k=>{s.checked[k]=false;});render();}
// --- Sync ---
const syncBar=document.getElementById("sync-bar");
let saveTimer=null;
function showSync(msg,type,duration){
  syncBar.textContent=msg;syncBar.className="sync-bar show "+type;
  if(duration)setTimeout(()=>{syncBar.classList.remove("show");},duration);
}
function getFullState(){
  return {newItems:NEW.map(s=>({id:s.id,label:s.label,note:s.note,critical:s.critical,skip:s.skip,items:s.items})),oldItems:OLD.map(s=>({id:s.id,label:s.label,note:s.note,critical:s.critical,skip:s.skip,items:s.items})),state:state,mode:mode,clientName:document.getElementById("clientName").value,clientDate:document.getElementById("clientDate").value};
}
function applyFullState(d){
  if(!d)return;
  if(d.newItems)d.newItems.forEach((saved,i)=>{if(NEW[i]){NEW[i].items=saved.items;}});
  if(d.oldItems)d.oldItems.forEach((saved,i)=>{if(OLD[i]){OLD[i].items=saved.items;}});
  if(d.state){
    if(d.state.new){state.new.checked=d.state.new.checked||{};state.new.order=d.state.new.order||{};}
    if(d.state.old){state.old.checked=d.state.old.checked||{};state.old.order=d.state.old.order||{};}
    if(d.state.collapsed)state.collapsed=d.state.collapsed;
  }
  if(d.mode)mode=d.mode;
  if(d.clientName)document.getElementById("clientName").value=d.clientName;
  if(d.clientDate)document.getElementById("clientDate").value=d.clientDate;
  document.getElementById("btn-new").classList.toggle("active",mode==="new");
  document.getElementById("btn-old").classList.toggle("active",mode==="old");
  render();
}
function schedSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    showSync("Saving...","saving");
    try{
      const r=await fetch("/api/onboarding-state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(getFullState())});
      if(r.ok){showSync("Saved","saved",1500);}
      else{showSync("Save failed","error",3000);}
    }catch(e){showSync("Save failed — offline?","error",3000);}
  },800);
}
async function loadState(){
  showSync("Loading...","loading");
  try{
    const r=await fetch("/api/onboarding-state");
    if(r.ok){const d=await r.json();if(d){applyFullState(d);showSync("Loaded","saved",1200);}else{showSync("No saved data — starting fresh","saved",1500);render();}}
    else{showSync("Load failed","error",3000);render();}
  }catch(e){showSync("Could not connect","error",3000);render();}
}
// Wrap mutation fns to auto-save
const _origToggle=null;
const _origRender=render;
["updateProgress","updateBadge"].forEach(()=>{});
// Hook save into all mutating actions
const _deleteItem=deleteItem;
const _addItem=addItem;
const _cycleWho=cycleWho;
// Patch toggle in renderItems — we patch via a flag
let _afterToggle=schedSave;
let _afterEdit=schedSave;
let _afterDrop=schedSave;
// Override the mutating functions
const origDeleteItem=window.deleteItem;
window.deleteItem=function(sec,idx){origDeleteItem(sec,idx);schedSave();};
const origAddItem=window.addItem;
window.addItem=function(sec){origAddItem(sec);schedSave();};
const origCycleWho=window.cycleWho;
window.cycleWho=function(sec,idx){origCycleWho(sec,idx);schedSave();};
const origSetMode=window.setMode;
window.setMode=function(m){origSetMode(m);schedSave();};
const origResetAll=window.resetAll;
window.resetAll=function(){origResetAll();schedSave();};
// Save on client name/date change
document.getElementById("clientName").addEventListener("input",schedSave);
document.getElementById("clientDate").addEventListener("change",schedSave);
// Poll for updates every 30s
setInterval(async()=>{
  try{const r=await fetch("/api/onboarding-state");if(r.ok){const d=await r.json();if(d)applyFullState(d);}}catch(e){}
},30000);
// Initial load
loadState();

</script>
</body>
